# Fly app for the poly-worker service. Deploy: flyctl deploy . -c fly/poly-worker.toml
# Secrets are set with `fly secrets` per app, never in this file.
app = "kaygo-poly-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../Dockerfile"

# Non-secret settings MUST live here: `fly deploy` replaces the machine config with this file,
# so any env set only with `fly machine update --env` is wiped on the next deploy (Oct 23 outage).
# Live Combo Locks Polymarket quoting (Kevin approved Oct 20). Hedges stay dry: POLY_SINGLE_LEG_LIVE unset.
[env]
  COMBO_CAP_AT_CONFIRM = "1"
  POLY_DRY_RUN = "0"
  POLYMARKET_RFQ_LIVE = "1"
  COMBO_VENUE_COORD = "1"
  # Poly sniper fair = full 4-venue inverse method incl. Polymarket (Kevin Oct 23). Sniper stays DRY (secrets).
  POLY_SNIPER_FAIR_INCLUDE_POLY = "1"
  POLY_SNIPER_MIN_ROI_TD = "0.06"   # Kevin Oct 23: NFL player-TD parlays need 6% (highest rule wins)
  POLY_SNIPER_MIN_ROI_NFL_ML = "0.05"  # Kevin Oct 30: all-NFL-ML parlays 5% (was 3%); nothing below 5%
  POLY_SNIPER_MIN_ROI_NFL = "0.05"     # Kevin Oct 30: other NFL 5% (was 4%); NCAAF 5%, NBA 6% unchanged
  # Poly sniper LIVE (Kevin Oct 29, preview): same caps as the Kalshi sniper (its live values Oct 29).
  # Going live needs BOTH: secret POLY_SNIPER_DRY_RUN=0 (today 1 = hard dry run) AND the DB switch
  # public.poly_sniper_control.live = true (default false; polled every 5s, no restart; off deletes all
  # open sniper quotes). Resting quotes count $0; only accepted/confirmed/filled risk counts.
  POLY_SNIPER_MAX_RISK = "500"                # $ worst-case loss per quote (Kevin Oct 30: $400 -> $500)
  POLY_SNIPER_MAX_PAYOUT = "100000"           # $ payout (contracts) per quote
  POLY_SNIPER_PER_GAME_CAP = "1500"
  POLY_SNIPER_PER_LEG_CAP = "1000"   # Kevin Oct 30: $750 -> $1,000
  POLY_SNIPER_TOTAL_EXPOSURE_CAP = "10000"
  POLY_SNIPER_LONG_EXPOSURE_CAP = "5000"      # parlays settling > 48h after the quote
  POLY_SNIPER_SHORT_SETTLE_HOURS = "48"
  POLY_SNIPER_DAILY_RISK_CAP = "10000"        # new filled risk per ET day
  POLY_SNIPER_DAILY_LOSS_CAP = "10000"        # realized loss per ET day -> auto-off until midnight ET
  POLY_SNIPER_SOON_CAP = "1"                  # settles <= 24h: total cap = cash above the floor (never below $10,000)
  POLY_SNIPER_SOON_HOURS = "24"
  POLY_SNIPER_MAX_LEG_DAYS = "7"
  POLY_SNIPER_CASH_FLOOR_USD = "5000"         # never post/confirm if Poly buying power - risk < this (Combo Locks funding)
  POLY_SNIPER_POST_RPS = "20"                 # sniper quote posts/s (Polymarket US regular tier: 100/s per account)
  POLY_SNIPER_CANCEL_RPS = "20"
  POLY_SNIPER_DECLINE_PAUSE_RATIO = "0.10"    # pause if declines > 10% of accepts in the last hour (Polymarket pauses at 15%)

[processes]
  app = "npm run start:poly"

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  size = "performance-1x"
  memory = "2gb"

# One machine. Only app that holds the Polymarket RFQ keys.
