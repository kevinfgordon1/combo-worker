# Fly app for the noboost-paper service. Deploy: flyctl deploy . -c fly/noboost-paper.toml
# Secrets are set with `fly secrets` per app, never in this file.
app = "kaygo-noboost-paper"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "node noboost/start.js"

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Paper only. NOBOOST_LIVE must never be set.
[env]
  NOBOOST_SHADOW = "1"
  NOBOOST_ODDS_RELAY_URL = "http://kaygo-odds-relay.internal:8787"
