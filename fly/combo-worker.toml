# Fly app for the combo-worker service. Deploy: flyctl deploy . -c fly/combo-worker.toml
# Secrets are set with `fly secrets` per app, never in this file.
app = "kaygo-combo-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "npm start"

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  size = "performance-1x"
  memory = "2gb"

# EXACTLY ONE machine, ever. No [http_service], so Fly never auto-starts/stops it.
# Never 'fly scale count' above 1; stop Railway combo-worker before the first start.
[env]
  COMBO_POLY_ENABLED = "0"
