# Fly app for the combo-worker service. Deploy: flyctl deploy . -c fly/combo-worker.toml
# Secrets are set with `fly secrets` per app, never in this file.
app = "kaygo-combo-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "npm start"

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  # Nov 1 2026: was performance-1x (1 dedicated core shared by the main runner AND the intake
  # worker thread). At NFL Sunday volume (~9.3k Kalshi frames/s over 8 shards, ~4k JSON.parse/s)
  # the intake thread fell 4-15s behind and Kalshi closed sockets (1008 "delivery exceeded 15
  # seconds", code 25 "Subscription buffer overflow"). 2 cores = one for each thread.
  # Rollback: size = "performance-1x", memory = "2gb".
  size = "performance-2x"
  memory = "4gb"

# EXACTLY ONE machine, ever. No [http_service], so Fly never auto-starts/stops it.
# Never 'fly scale count' above 1; stop Railway combo-worker before the first start.
[env]
  # SNIPER_SHADOW_MIN_EDGE is intentionally unset. Set it (for example 0.03)
  # only with Kevin's OK, then deploy this app. The shadow path reads the
  # Kalshi RFQs this process already receives. SNIPER_ENABLED stays unset
  # and the shadow path has no quote client.
  COMBO_POLY_ENABLED = "0"
  # Oct 25: decode the Kalshi feed on a worker thread (main thread was lagging ~1.1s at kickoff volume).
  COMBO_INTAKE_WORKER = "1"
  # Keep the old any-lock-game filter (#278 AND filter dropped real matches on testers).
  KALSHI_WS_NEEDLE_ALL = "0"
