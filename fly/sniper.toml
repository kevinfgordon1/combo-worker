# Fly app for the sniper service. Deploy: flyctl deploy . -c fly/sniper.toml
# Secrets are set with `fly secrets` per app, never in this file.
app = "kaygo-sniper"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"   # Oct 25: room to cancel every open quote on SIGTERM

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "node start-sniper.js"   # Oct 25: node gets SIGTERM directly (npm/sh killed it before quotes were cancelled)

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  size = "performance-2x"   # Kevin Oct 25: event-loop lag, 2 CPUs
  memory = "4gb"

# One machine. Stays dry-run until Kevin flips it.
[env]
  SNIPER_DRY_RUN = "1"
  SNIPER_KALSHI_SUBACCOUNT = "1"
  # Kevin's go-live risk rules (Oct 22)
  SNIPER_MAX_RISK = "400"   # Kevin Oct 26: per-quote risk $200 -> $400
  # Kevin Oct 26: account is Kalshi Advanced (~150 quote writes/s). Our budget 30/s:
  # sniper 20/s (steps down to 10/s after any 429), 2/s guaranteed for routine cancels;
  # 9/s reserved for Kevin's Combo Locks on kaygo-combo-worker. Code clamps to 30 - 9.
  SNIPER_KALSHI_TRADE_RPS = "20"
  SNIPER_KALSHI_TRADE_RPS_ON_429 = "10"
  SNIPER_CANCEL_SHARE_RPS = "2"
  KALSHI_ACCOUNT_WRITE_RPS = "30"
  COMBO_LOCKS_RESERVED_RPS = "9"
  SNIPER_MAX_PAYOUT = "100000"
  SNIPER_DAILY_LOSS_CAP = "10000"
  SNIPER_DAILY_RISK_CAP = "15000"
  SNIPER_TOTAL_EXPOSURE_CAP = "15000"
  SNIPER_INTAKE_WORKER = "1"
  SNIPER_LOCK_COORD = "0"      # Kevin Oct 25: no Combo Locks checks; locks win on price anyway
  SNIPER_LONG_EXPOSURE_CAP = "5000"     # Kevin Oct 23: parlays settling >48h after quote (Kevin Oct 24: 32h->48h)
  SNIPER_SHORT_SETTLE_HOURS = "48"
  SNIPER_SOON_CAP = "1"          # Kevin Oct 26: parlays settling within SNIPER_SOON_HOURS: total cap = sniper cash (never below the normal total cap)
  SNIPER_SOON_HOURS = "24"
  SNIPER_MAX_LEG_DAYS = "7"      # Kevin Oct 26: reject any RFQ with a leg whose game is > 7 days out (all sports)
  SNIPER_FETCH_TIMEOUT_MS = "30000"   # Kevin Oct 24: 8s cut off Kalshi book pulls
  SNIPER_PER_GAME_CAP = "1500"
  SNIPER_MIN_ROI = "0.05"         # Kevin Oct 27: all-NFL parlays 5% (was 4%); TD 7%, college/NBA 6% unchanged
  SNIPER_MIN_ROI_TD = "0.07"      # Kevin Oct 24: any NFL player-TD leg needs 7% (highest rule wins)
  SNIPER_MIN_ROI_NCAAF = "0.06"   # Kevin Oct 24: college 6% (4% all-NFL-ML, 5% other NFL)
  SNIPER_FAIR_DEPTH_USD = "1000"   # NFL player-TD legs ($ potential profit, not stake)
  SNIPER_GAME_DEPTH_USD = "2000"   # NFL + college moneylines (and spreads/totals) ($ potential profit, not stake)
  SNIPER_LINES = "1"              # main spreads/totals (preview)
  SNIPER_ROGUE_MODE = "shadow"     # weekend: log rogue_line rows only, never change the fair
  SNIPER_MIN_ROI_LINES = "0.05"   # Kevin Oct 24: other NFL 5%
  SNIPER_NBA = "1"                # Kevin Oct 23: NBA moneylines + main spreads/totals (no player props)
  SNIPER_MIN_ROI_NBA = "0.06"     # Kevin Oct 24: any NBA leg needs 6% (highest rule wins)
  SNIPER_NBA_HOURS = "36"         # NBA legs must tip within 36h of the quote
  SNIPER_NBA_GAME_HOURS = "3"     # NBA settle_at = last tip + 3h
  SNIPER_ODDS_RELAY_URL = "http://kaygo-odds-relay.internal:8787"
