# Fly app for the sniper service. Deploy: flyctl deploy . -c fly/sniper.toml
# Secrets are set with `fly secrets` per app, never in this file.
app = "kaygo-sniper"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "npm run start:sniper"

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  size = "performance-1x"
  memory = "2gb"

# One machine. Stays dry-run until Kevin flips it.
[env]
  SNIPER_DRY_RUN = "1"
  SNIPER_KALSHI_SUBACCOUNT = "1"
  # Kevin's go-live risk rules (Oct 22)
  SNIPER_MAX_RISK = "200"
  SNIPER_MAX_PAYOUT = "100000"
  SNIPER_DAILY_LOSS_CAP = "5000"
  SNIPER_TOTAL_EXPOSURE_CAP = "5000"
  SNIPER_PER_GAME_CAP = "1500"
  SNIPER_MIN_ROI = "0.03"
  SNIPER_MIN_ROI_TD = "0.04"
  SNIPER_MIN_ROI_NCAAF = "0.04"   # Kevin Oct 23: college 5% -> 4% (3% only for all-NFL-ML parlays)
  SNIPER_FAIR_DEPTH_USD = "1000"   # NFL player-TD legs
  SNIPER_GAME_DEPTH_USD = "2000"   # NFL + college moneylines (and spreads/totals)
  SNIPER_ODDS_RELAY_URL = "http://kaygo-odds-relay.internal:8787"
