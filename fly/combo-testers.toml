# Fly app for the Combo Locks testers supervisor (non-Kevin users).
# Deploy: flyctl deploy . -c fly/combo-testers.toml -a kaygo-combo-testers --local-only --ha=false
# Secrets (fly secrets, never here): SUPABASE_URL, SUPABASE_SERVICE_KEY only.
# NEVER set Kevin's KALSHI_*/SNIPER_KALSHI_* or any POLYMARKET_* keys on this app;
# tester keys come from Supabase (combo_exchange_keys_for_worker) per child.
app = "kaygo-combo-testers"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "npm run start:testers"

[deploy]
  # never rolling/bluegreen: no overlap of two copies
  strategy = "immediate"

[[vm]]
  # Was shared-cpu-2x / 1gb. On 2026-10-25 the machine stalled ~50 min after each
  # restart: /proc/stat showed ~98% CPU steal (Fly shared-CPU quota exhausted ->
  # host throttling), load avg 12-17 while the 6 live-runners only used ~0.2 core.
  # Dedicated cores have no burst quota, so no throttle cliff.
  # Rollback switch: size = "shared-cpu-2x", memory = "1gb".
  size = "performance-2x"
  memory = "4gb"
  # Still ONE machine.

# EXACTLY ONE machine, ever. No [http_service]. Railway combo-testers must stay stopped.
[env]
  WORKER_MODE = "testers"
  KALSHI_BUCKET_AUTO = "0"
  KALSHI_BUCKET_SWEEP = "0"
  # Oct 25 overload/clock fix (one switch). Children get COMBO_INTAKE_WORKER=1,
  # KALSHI_WS_SHARD_FACTOR=2, KALSHI_CLOCK_MIDPOINT=1, COMBO_NEAR_MISS_LOG=1.
  # Rollback: TESTERS_PERF = "0" (or TESTER_ENV_<NAME> = "0" for one piece).
  TESTERS_PERF = "1"
